name: Custom Env Variables

on:
  workflow_dispatch:

env:
  VAR_1: "workflow level"
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: disply1 value of VAR_1
        run: |
            echo "Value of VAR_1 is $VAR_1"
            echo "::group::My title"
            echo "Inside group"
            echo "::endgroup::"
            echo "::add-mask::Mona The Octocat"
            echo "{markdown content}" >> $GITHUB_STEP_SUMMARY
            echo "### Hello world! :rocket:" >> $GITHUB_STEP_SUMMARY

            
        
      - name: write value to $GITHUB_ENV file
        run: echo "VAR_1=value set from first step" >> "$GITHUB_ENV"

      - name: disply2 value of VAR_1
        run: echo "Value of VAR_1 is $VAR_1"

      - name: disply3 value of VAR_1
        run: echo "Value of VAR_1 is $VAR_1"
        env:
          VAR_1: "disply3 level"

      - name: disply4 value of VAR_1
        run: echo "Value of VAR_1 is $VAR_1"
        
      - name: Set color
        id: color-selector							
        run: echo "SELECTED_COLOR=green" >> "$GITHUB_OUTPUT"

      - name: Get color								
        env:
          SELECTED_COLOR: ${{ steps.color-selector.outputs.SELECTED_COLOR }}
        run: echo "The selected color is $SELECTED_COLOR"

